name: Build

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  schedule:
    # Run daily at 03:00 UTC to catch regressions from new Flutter releases
    # (scheduled workflows only run on the default branch).
    - cron: "0 3 * * *"

jobs:
  build:
    name: Run flutter test and analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Flutter 3.47 migration baseline.
          - channel: stable
            flutter-version: "3.47.9"
          # Latest stable — no version pin, so it runs against the current stable release.
          - channel: stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.channel }}

      - name: Set environment paths
        run: |
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          echo "PUB_CACHE="$HOME/.pub-cache"" >> $GITHUB_ENV

      - name: Setup melos
        run: |
          flutter pub get
          dart run melos --version
          dart run melos bootstrap

      - name: Verify formatting
        run: dart run melos exec dart format --output=none --set-exit-if-changed .

      - name: Run flutter analyze
        run: dart run melos run analyze

      - name: Run tests
        run: dart run melos run test
